name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use release signing key if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/konektor.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/konektor.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk Konektor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Konektor-android
          path: Konektor.apk
      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Konektor.apk --prerelease \
            --title "Konektor (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Konektor.apk on your phone to install."
